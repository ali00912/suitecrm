apiVersion: apps/v1
kind: Deployment
metadata:
  name: suitecrm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: suitecrm
  template:
    metadata:
      labels:
        app: suitecrm
    spec:
      containers:
      - name: suitecrm
        image: localhost:5000/suitecrm:v3
        imagePullPolicy: Always