version: "3.8"

services:
  mariadb:
    image: mariadb:10.11
    container_name: suitecrm8-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: suitecrm
      MYSQL_USER: suitecrm
      MYSQL_PASSWORD: suitecrmpass
    volumes:
      - mariadb_data:/var/lib/mysql

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suitecrm8-php
    restart: always
    volumes:
      - ./SuiteCRM-8.10.2:/var/www/html
    working_dir: /var/www/html

  nginx:
    image: nginx:latest
    container_name: suitecrm8-nginx
    restart: always
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./SuiteCRM-8.10.2:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  mariadb_data:
